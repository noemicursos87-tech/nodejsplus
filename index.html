<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcu</title>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <!-- CADA VEZ QUE ALGUIEN ENTRE HAYA 2 NUM entre 0 y 100 Y HABRA 4 BOTONES (SUMAR, RESTAR, DIVIDIR Y MULTIPLICAR) -->
    <!-- espacios entre routs, hay 7 -->

    <!-- //Titulo -->
<h1>Números Aleatorios</h1>

    <!-- // Numeros aleatorios -->
<section class="numerosAleatorios">
    <span class="numeroIzq" id="numeroIzq"></span>
    <span class="numeroDer" id="numeroDer"></span>
</section>

    <!-- //Boton de nuevos Numeros -->
<button class="calculator_btn calculator_btn--substract generate" id="btnNuevosNúmeros">
Generar nuevos
</button>

    <!-- //Zona botones de sumar y RESTAR (sera un rou) -->
<section class="zonaBotonesSumaResta">
    <button class="btn" id="btnSumar">SUMAR</button>
    <button class="btn" id="btnRestar">RESTAR</button>
</section>

<!-- //Zona de resultado  -->

<section class="zonaResultadoSumaResta"></section>
    <span class="resultado resultadoSuma" id="resultadosuma"></span>  
    <span class="resultadoResta" id="resultadoresta"></span>


<!-- //Zona de botones de MULTIPLICAR Y DIVIDIR (sera otro rou) -->
<section class="zonaBotonesMultiplicarDividir">
    <button class="btn" id="btnMultiplicar">MULTIPLICAR</button>
    <button class="btn" id="btnDividir">DIVIDIR</button>
</section>


<!-- //Zona de resultado -->
<section class="zonaResultadoMultiplicarDividir"></section>
    <span class="resultado resultadoMultiplicar" id="resultadoMultiplicar"></span>  
    <span class="resultado resultadoDividir" id="resultadoDividir"></span>
</body>
<script type="module" src="./js/index.js"></script>
</html>
